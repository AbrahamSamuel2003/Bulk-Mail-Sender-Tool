[project]
name = "bulk-email-outreach-backend"
version = "0.1.0"
description = "FastAPI + Celery backend for AI-Powered Bulk Email Outreach & Follow-Up Management System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "openpyxl>=3.1.5",
    "openai>=1.55.0",
    "google-api-python-client>=2.154.0",
    "google-auth>=2.36.0",
    "google-auth-oauthlib>=1.2.1",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.17",
    "email-validator>=2.2.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

